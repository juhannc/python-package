# SPDX-FileCopyrightText: {{ cookiecutter.__year }} {{ cookiecutter.author_name }}
#
# SPDX-License-Identifier: {{ cookiecutter.license }}

[project]
name = "{{ cookiecutter.package_slug }}"
version = "{{ cookiecutter.version }}"
description = "{{ cookiecutter.short_description }}"
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
license = "{{ cookiecutter.license }}"
license-files = ["LICENSES/*"]
authors = [{ name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" }]
classifiers = [
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: {{ cookiecutter.python_version }}",
  "Typing :: Typed"
] # TODO @{{ cookiecutter.author_email }}: add/update project classifiers here from https://pypi.org/classifiers/
dependencies = []

[project.urls]
# TODO @{{ cookiecutter.author_email }}: add URLs here
# Documentation =
# Homepage =
# Source =
# Tracker =

[project.scripts]
{{ cookiecutter.package_slug }} = "{{ cookiecutter.package_slug }}.__main__:main"

[dependency-groups]
dev = [
  "commitizen>=4.19.4",
  "prek>=0.5.11",
  "reuse>=6.3.0",
  "ruff>=0.17.5",
  "ty>=0.0.107",
  "uv>=0.13.9"
]
docs = [
  "sphinx",
  "sphinx-autoapi",
  "sphinx-autodoc-typehints",
  "sphinx-rtd-theme>=3.0.0"
]
lint = ["pylint", "pylint-per-file-ignores"]
tests = ["coverage", "pytest>=9.0.0", "pytest-cov"]

[build-system]
requires = ["uv_build>=0.13.0,<1.0.0"]
build-backend = "uv_build"

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"
ignore-words-list = "nd"

[tool.commitizen]
bump_message = "bump: version $current_version -> $new_version"
gpg_sign = true
name = "cz_conventional_commits"
pre_bump_hooks = [
  "python -c \"import re; from datetime import date; c=open('CITATION.cff').read(); open('CITATION.cff','w').write(re.sub(r'^(date-released: )\\\\d{4}-\\\\d{2}-\\\\d{2}', r'\\\\g<1>' + date.today().isoformat(), c, flags=re.M))\"",
  "uv lock"
]
tag_format = "$version"
version = "2.2.0"
version_files = [
  "CITATION.cff:^version",
  "docs/conf.py:release",
  "pyproject.toml:version"
]
version_provider = "commitizen"
version_scheme = "pep440"

[tool.flake8]
check-return-types = true
extend-ignore = ["DCO010", "DCO060"]
# TypedDict keys such as `__ndarray__` are real fields and are documented.
ignore-special-dunder-class-attributes = false
# Document `*args`/`**kwargs` without stars, as flake8-docstrings-complete expects.
omit-stars-when-documenting-varargs = true
per-file-ignores = []
select = "DCO, DOC"
style = "google"
# Properties listed under `Attributes:` count as class attributes.
treat-property-methods-as-class-attributes = true

[tool.licensecheck]
ignore_packages = []
using = "PEP631"
zero = true

[tool.pylint.MASTER]
extension-pkg-allow-list = []
load-plugins = ["pylint_per_file_ignores"]

[tool.pylint.'MESSAGES CONTROL']
max-line-length = "88"

[tool.pylint.SIMILARITIES]
ignore-comments = "yes"
ignore-docstrings = "yes"
ignore-imports = "yes"
min-similarity-lines = 10

[tool.pylint-per-file-ignores]
# docs/conf.py: Ignore constant name not UPPER_CASE (C0103) and redefining built-in (W0622) for copyright notice
# tests/*: Ignore missing docs (C0114, C0116), too long lines (E501), too few/many public methods (R0903, R0904), access to protected member (W0212)
"docs/conf.py" = "C0103,W0622"
"tests/*" = "C0114,C0116,E501,R0903,R0904,W0212"

[tool.pytest.ini_options]
addopts = "--cov=src/{{ cookiecutter.package_slug }}/ --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=report.xml"
filterwarnings = []
testpaths = ["tests"]

[tool.ruff]
fix = true
unsafe-fixes = true

[tool.ruff.format]
preview = true

[tool.ruff.lint]
extend-select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "D",
  "DOC",
  "DTZ",
  "E",
  "ERA",
  "EXE",
  "F",
  "FAST",
  "FBT",
  "FLY",
  "FURB",
  "I",
  "ICN",
  "INP",
  "ISC",
  "LOG",
  "N",
  "NPY",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "TID",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLOT",
  "SLF",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W"
]
fixable = ["ALL"]
# E203: incorrectly triggers on array slices: <https://github.com/PyCQA/pycodestyle/issues/373>
# D105: Docstrings in standard magic methods are superfluous
# D107: Google docstring style prevents docstrings in __init__ function
ignore = [
  "whitespace-before-punctuation",
  "undocumented-magic-method",
  "undocumented-public-init"
]
preview = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = ["implicit-namespace-package"]
"tests/*" = [
  "assert",
  "missing-return-type-public-function",
  "missing-return-type-static-method",
  "D",
  "line-too-long",
  "too-many-public-methods",
  "import-private-name",
  "import-outside-top-level",
  "magic-value-comparison",
  "private-member-access",
  "suspicious-eval-usage",
  "doc-line-too-long"
]


[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.tombi.format.rules]
line-width = 80

[tool.uv]
default-groups = "all"
exclude-newer = "7 days"
